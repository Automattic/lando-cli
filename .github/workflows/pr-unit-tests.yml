name: Run Unit Tests

on:
  pull_request:

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        node-version:
          # mock-fs 5.5.0 cannot initialize on Node 26.
          - '22.23.2'
          - '24.x'
    steps:

      # Install deps and cache
      # Eventually it would be great if these steps could live in a separate YAML file
      # that could be included in line to avoid code duplication
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci

      # Run unit tests
      - name: Run unit tests
        run: npm run test:unit

  discovery-tests:
    name: Discovery tests (${{ matrix.os }}, Node 26)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Node 26
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # These tests use temporary real files, without loading mock-fs.
      - name: Run filesystem-backed discovery tests
        run: node node_modules/mocha/bin/mocha.js --timeout 10000 test/discovery.spec.js
